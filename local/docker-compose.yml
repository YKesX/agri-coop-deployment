services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agricoop
      POSTGRES_PASSWORD: agricoop_local
      POSTGRES_DB: agricoop
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agricoop"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../apps/backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://agricoop:agricoop_local@postgres:5432/agricoop
      RUN_SEED: "true"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../apps/frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
